<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">后端全局关系图</title>
  <desc id="desc">展示用户、设备、事件、联系人、文档、聊天、ReAct Agent、向量库和 PostgreSQL 的关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .canvas { fill: #f7f7f7; }
      .box { fill: #fff; stroke: #d9d9d9; stroke-width: 1.5; }
      .text { fill: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; }
      .label { fill: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; }
      .line { fill: none; stroke: #4b5563; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1280" height="720"/>

  <rect class="box" x="56" y="110" width="136" height="72"/>
  <text class="text" x="124" y="155" text-anchor="middle">用户</text>

  <rect class="box" x="330" y="36" width="136" height="72"/>
  <text class="text" x="398" y="81" text-anchor="middle">设备</text>

  <rect class="box" x="860" y="36" width="136" height="72"/>
  <text class="text" x="928" y="81" text-anchor="middle">事件</text>

  <rect class="box" x="1126" y="36" width="136" height="72"/>
  <text class="text" x="1194" y="81" text-anchor="middle">事件消息</text>

  <rect class="box" x="295" y="180" width="206" height="72"/>
  <text class="text" x="398" y="225" text-anchor="middle">联系人申请</text>

  <rect class="box" x="838" y="180" width="182" height="72"/>
  <text class="text" x="929" y="225" text-anchor="middle">好友会话</text>

  <rect class="box" x="32" y="320" width="182" height="72"/>
  <text class="text" x="123" y="365" text-anchor="middle">上传文档</text>

  <rect class="box" x="306" y="320" width="182" height="72"/>
  <text class="text" x="397" y="365" text-anchor="middle">文档分块</text>

  <rect class="box" x="802" y="334" width="254" height="72"/>
  <text class="text" x="929" y="379" text-anchor="middle">Qdrant/Chroma</text>

  <rect class="box" x="32" y="536" width="182" height="72"/>
  <text class="text" x="123" y="581" text-anchor="middle">聊天会话</text>

  <rect class="box" x="306" y="464" width="182" height="72"/>
  <text class="text" x="397" y="509" text-anchor="middle">聊天消息</text>

  <rect class="box" x="288" y="606" width="220" height="72"/>
  <text class="text" x="398" y="651" text-anchor="middle">ReAct Agent</text>

  <rect class="box" x="820" y="620" width="216" height="72"/>
  <text class="text" x="928" y="665" text-anchor="middle">PostgreSQL</text>

  <path class="line" d="M 188 110 C 245 72, 278 72, 330 72"/>
  <line class="line" x1="466" y1="72" x2="860" y2="72"/>
  <text class="label" x="620" y="68">状态=告警/异常/离线</text>
  <line class="line" x1="996" y1="72" x2="1126" y2="72"/>

  <path class="line" d="M 188 182 C 245 226, 254 216, 295 216"/>
  <line class="line" x1="501" y1="216" x2="838" y2="216"/>

  <line class="line" x1="214" y1="356" x2="306" y2="356"/>
  <path class="line" d="M 488 356 C 600 356, 682 362, 802 366"/>

  <path class="line" d="M 188 536 C 245 496, 260 500, 306 500"/>
  <path class="line" d="M 188 608 C 244 648, 253 642, 288 642"/>
  <path class="line" d="M 508 606 C 628 535, 710 470, 860 406"/>
  <path class="line" d="M 508 642 C 612 650, 708 656, 820 656"/>
</svg>
